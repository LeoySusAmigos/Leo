<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="contenedorLogin">
        
        <div class="login-wrapper">
            <div class="logoArea1">
                <img src="images/cartelito.png" alt="Leo & Friends">
            </div>

            <img src="images/Leito.png" class="personaje camaleon" alt="Leo">
            <div class="info-box box-leo">
                <h3>LEO</h3>
                <p>Enseña a<br><strong>LEER</strong></p>
            </div>

            <img src="images/finxhidden.png" class="personaje gato" alt="Finx">
            <div class="info-box box-finx">
                <h3>FINX</h3>
                <p>Acompaña en la<br><strong>LECTURA</strong></p>
            </div>

            <img src="images/capyhidden.png" class="personaje capibara" alt="Capy">
            <div class="info-box box-capy">
                <h3>CAPY</h3>
                <p>Ayuda con la<br><strong>GRAMÁTICA</strong></p>
            </div>

            <form class="form" method="POST" action="php/register.php">
                <div class="header-text">
                    <h1>¡únete a la aventura!</h1>
                    <p>
                        Crea tu cuenta para empezar a <br>
                        aprender de forma divertida.
                    </p>
                </div>

                <div class="input-container">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" class="inputs" placeholder="Nombre del padre/madre/responsable" name="nombre">
                </div>

                <div class="input-container">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" class="inputs" placeholder="Correo electrónico" name="correo">
                </div>                

                <div class="input-container">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="inputs" placeholder="Contraseña" name="password">
                </div>
                <div class="input-container">
                    <input type="password" class="inputs" placeholder="Confirmar contraseña" name="confirm_password">
                </div>

                <div class="input-container">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" class="inputs" placeholder="Nombre del niño/a" name="nombre">
                </div>

                <button class="btn-submit" type="submit">Registrarse</button>

                <div class="divider">o continúa con</div>

                <div class="social-login">
                    <button class="social-btn"><img src="https://authjs.dev/img/providers/google.svg" alt="G"></button>
                    <button class="social-btn"><img src="https://authjs.dev/img/providers/apple.svg" alt="A"></button>
                    <button class="social-btn"><img src="images/microsoft-logo.png" alt="M"></button>
                </div>

                <p class="signup-text">¿Ya tienes cuenta? <a href="login.html"><u>Iniciar sesión</u></a></p>
            </form>
        </div>

    </main>
</body>
</html>
