<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="contenedorLogin">

        <div class="logoArea1">
            <img src="images/cartelito2.png" alt="Leo & Friends">
        </div>

        <div class="login-wrapper">

            <img src="images/Leito.png" class="personaje camaleon" alt="Leo">

            <img src="images/finxhidden.png" class="personaje gato" alt="Finx">

            <img src="images/capyhidden.png" class="personaje capibara" alt="Capy">

            <form class="form" method="POST" action="php/register.php">
                <div class="header-text">
                    <h1>¡únete a la aventura!</h1>
                    <p>
                        Crea tu cuenta para empezar a <br>
                        aprender de forma divertida.
                    </p>
                </div>

                <div class="input-container">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" class="inputs" placeholder="Nombre del padre/madre/responsable"
                        name="nombre_padre" required>
                </div>

                <div class="input-container">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" class="inputs" placeholder="Correo electrónico" name="correo" required>
                </div>

                <div class="input-container">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="inputs" placeholder="Contraseña" name="password" required>
                </div>
                <div class="input-container">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="inputs" placeholder="Confirmar contraseña" name="confirm_password" required>
                </div>

                <div class="input-container">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" class="inputs" placeholder="Nombre del niño/a" name="nombre_nino" required>
                </div>

                <button class="btn-submit" type="submit">Registrarse</button>

                <p class="signup-text">¿Ya tienes cuenta? <a href="login.html"><u>Iniciar sesión</u></a></p>
            </form>
        </div>

    </main>
</body>

</html>
