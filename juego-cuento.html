<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego</title>
    <link rel="stylesheet" href="styles/juego-cuento.css">
</head>
<body>

<div class="pantalla">

    <!-- PANEL SUPERIOR -->
    <div class="top-panel">

        <div class="mision">
            <b>Misión:</b> Ayuda a Ana a llegar a la manzana
        </div>

        <div class="contador">
            ⭐ 0/4
        </div>

        <div class="timer">
            ⏰ 3:00
        </div>

    </div>

    <!-- TABLERO -->
    <div class="tablero">

        <!-- LABERINTO -->
        <img src="images/juego-cuento/laberinto.png" class="laberinto">

        <!-- ARAÑA -->
        <div id="personaje">
            <img src="images/juego-cuento/spider 1.png">
        </div>

        <!-- LETRAS -->
        <div class="letra letra1">A</div>
        <div class="letra letra2">A</div>
        <div class="letra letra3">A</div>
        <div class="letra letra4">A</div>
        <div class="letra letra5">A</div>
        <div class="letra letra6">E</div>
        <div class="letra letra7">I</div>
        <div class="letra letra8">O</div>
        <div class="letra letra9">U</div>

        <!-- MANZANA -->
        <div class="meta">
            <img src="images/juego-cuento/manzana.png">
        </div>

    </div>

    <!-- BOTONES -->
    <div class="bottom-panel">

        <button><img src="images/juego-cuento/retry button.png"></button>
        <button><img src="images/juego-cuento/track button.png"></button>

    </div>

</div>

<script src="js/juego-cuento.js"></script>

</body>
</html>
