<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="contenedorLogin">

        <div class="logoArea">
            <img src="images/cartelito2.png" alt="Leo & Friends">
        </div>

        <div class="login-wrapper">

            <img src="images/Leito.png" class="personaje camaleon" alt="Leo">

            <img src="images/finxhidden.png" class="personaje gato" alt="Finx">

            <img src="images/capyhidden.png" class="personaje capibara" alt="Capy">

            <form class="form" method="POST" action="php/login.php">
                <div class="header-text">
                    <h1>¡Bienvenido de nuevo!</h1>
                    <p>Inicia sesión para continuar tu aventura.</p>
                </div>

                <div class="input-container">
                    <i class="fa-regular fa-user"></i>
                    <input type="email" class="inputs" placeholder="Correo electrónico" name="correo">
                </div>

                <div class="input-container">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="inputs" placeholder="Contraseña" name="password">
                </div>

                <a href="#" class="forgot-pass"><u>¿Olvidaste tu contraseña?</u></a>

                <button class="btn-submit" type="submit">Iniciar sesión</button>

                <p class="signup-text">¿No tienes cuenta? <a href="register.html"><u>Regístrate</u></a></p>
            </form>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');

        if (error === 'password') {
            Swal.fire({
                icon: 'error',
                title: '¡Ups!',
                text: 'La contraseña es incorrecta.',
                confirmButtonText: 'Intentar de nuevo'
            });
        }

        if (error === 'user') {
            Swal.fire({
                icon: 'warning',
                title: '¡No te encontramos!',
                text: 'No existe una cuenta con ese correo.',
                confirmButtonText: 'Entendido'
            });
        }
    </script>
</body>

</html>
